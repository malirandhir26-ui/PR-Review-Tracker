services:
  - type: web
    name: pr-review-tracker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login.php
    autoDeploy: true
    envVars:
      - key: DB_HOST
        value: 127.0.0.1
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: pr_review_tracker
      - key: DB_USER
        value: root
      - key: DB_PASS
        value: ""
